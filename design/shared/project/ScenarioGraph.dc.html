<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["selected","errors"],"default":"selected"},"$preview":{"width":960,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const errors = (this.props.mode ?? 'selected') === 'errors';
    return {
      payState: errors ? 'normal' : 'selected',
      priorityState: errors ? 'error' : 'normal',
      priorityError: errors ? '1' : '',
      otherState: errors ? 'error' : 'normal',
      otherError: errors ? '2' : ''
    };
  }
}
</script>
