<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Шапка редактора</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:#1F4FBF}
</style>
</helmet>
<header style="height: 56px; box-sizing: border-box; padding: 0 20px; background: #FFFFFF; border-bottom: 1px solid #D9DEE5; display: flex; align-items: center; gap: 28px; font-family: 'Golos Text', system-ui, sans-serif; color: #18212C">
<div style="font-size: 15px; font-weight: 700; white-space: nowrap">Редактор бота</div>
<nav aria-label="Разделы" style="display: flex; align-items: stretch; gap: 4px; height: 56px">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
<a href="{{tab.href}}" style="display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 14px; font-weight: 500; color: {{tab.color}}; border-bottom: 2px solid {{tab.line}}; box-sizing: border-box">{{tab.label}}<sc-if value="{{tab.count}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 600; background: #1F4FBF; color: #FFFFFF; border-radius: 10px; padding: 1px 7px">{{tab.count}}</span></sc-if></a>
</sc-for>
</nav>
<div style="flex: 1 1 auto"></div>
<div style="font-size: 13px; color: #546070; white-space: nowrap">Черновик сохранён в 14:32</div>
<div style="font-size: 13px; font-weight: 500; color: #0B6B4F; background: #E4F4EE; border-radius: 6px; padding: 5px 9px; white-space: nowrap">В боте: версия 7</div>
<a href="PublishErrors.dc.html" style="font-size: 14px; font-weight: 600; color: #FFFFFF; background: #1F4FBF; border-radius: 6px; padding: 9px 16px; white-space: nowrap">Опубликовать</a>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["scenario","leads","settings","versions"],"default":"scenario"},"$preview":{"width":1440,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'scenario';
    const tabs = [
      { id: 'scenario', label: 'Сценарий', href: 'Main.dc.html', count: 0 },
      { id: 'leads', label: 'Заявки', href: 'Leads.dc.html', count: 3 },
      { id: 'settings', label: 'Настройки', href: 'Settings.dc.html', count: 0 },
      { id: 'versions', label: 'Версии', href: 'Versions.dc.html', count: 0 }
    ];
    return {
      tabs: tabs.map((t) => ({
        ...t,
        color: t.id === active ? '#1F4FBF' : '#3A4656',
        line: t.id === active ? '#1F4FBF' : 'transparent'
      }))
    };
  }
}
</script>
</body>
</html>
