<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Панель шага</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<aside aria-label="Настройки шага" style="width: 336px; height: 800px; box-sizing: border-box; padding: 16px; background: #FFFFFF; border-left: 1px solid #D9DEE5; display: flex; flex-direction: column; gap: 16px; overflow: hidden; font-family: 'Golos Text', system-ui, sans-serif; font-size: 13px; color: #18212C">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="font-size: 15px; font-weight: 600">Шаг</div>
<span style="font-size: 12px; font-weight: 600; background: #E3EBFB; color: #1A459F; border-radius: 6px; padding: 3px 8px">Один выбор</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="step-text" style="font-weight: 500">Текст сообщения</label>
<textarea id="step-text" rows="3" style="font: inherit; font-size: 14px; line-height: 20px; box-sizing: border-box; width: 100%; padding: 8px 10px; border: 1px solid #A9B3C0; border-radius: 6px; color: #18212C; resize: vertical">Нужно ли подключать оплату на сайте?
Только для ИП и юрлиц</textarea>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="step-key" style="font-weight: 500">Название поля в заявке</label>
<input id="step-key" type="text" value="Оплата на сайте" style="font: inherit; font-size: 14px; box-sizing: border-box; width: 100%; height: 38px; padding: 0 10px; border: 1px solid #A9B3C0; border-radius: 6px; color: #18212C">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-weight: 500">Кнопки</div>
<div style="border: 1px solid #D9DEE5; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; color: #3A4656">Подпись<input type="text" value="Да" style="font: inherit; font-size: 14px; box-sizing: border-box; width: 100%; height: 36px; padding: 0 10px; border: 1px solid #A9B3C0; border-radius: 6px; color: #18212C"></label>
<label style="display: flex; flex-direction: column; gap: 4px; color: #3A4656">Куда ведёт<select style="font: inherit; font-size: 14px; box-sizing: border-box; width: 100%; height: 36px; padding: 0 8px; border: 1px solid #A9B3C0; border-radius: 6px; background: #FFFFFF; color: #18212C"><option>Нужен ли расчёт стоимости доставки?</option></select></label>
</div>
<div style="border: 1px solid #D9DEE5; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; color: #3A4656">Подпись<input type="text" value="Нет" style="font: inherit; font-size: 14px; box-sizing: border-box; width: 100%; height: 36px; padding: 0 10px; border: 1px solid #A9B3C0; border-radius: 6px; color: #18212C"></label>
<label style="display: flex; flex-direction: column; gap: 4px; color: #3A4656">Куда ведёт<select style="font: inherit; font-size: 14px; box-sizing: border-box; width: 100%; height: 36px; padding: 0 8px; border: 1px solid #A9B3C0; border-radius: 6px; background: #FFFFFF; color: #18212C"><option>Нужен ли расчёт стоимости доставки?</option></select></label>
</div>
<button type="button" style="font: inherit; font-weight: 500; height: 38px; border: 1px dashed #7C8796; border-radius: 6px; background: transparent; color: #1F4FBF">Добавить кнопку</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="step-when" style="font-weight: 500">Когда показывать</label>
<select id="step-when" style="font: inherit; font-size: 14px; box-sizing: border-box; width: 100%; height: 38px; padding: 0 8px; border: 1px solid #A9B3C0; border-radius: 6px; background: #FFFFFF; color: #18212C"><option>Всегда</option></select>
</div>
<div style="flex: 1 1 auto"></div>
<button type="button" style="font: inherit; font-weight: 500; height: 40px; border: 1px solid #D9DEE5; border-radius: 6px; background: #FFFFFF; color: #B3261E">Удалить шаг</button>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":336,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
