services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: brief
      POSTGRES_PASSWORD: brief
      POSTGRES_DB: brief
    ports:
      - "55432:5432"
    volumes:
      - brief_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "56379:6379"

volumes:
  brief_pg:
